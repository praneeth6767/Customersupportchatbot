name: Build Node.js Image (No Dockerfile)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: [actions/checkout@v4](https://github.com)

      - name: Log in to Docker Hub
        uses: [docker/login-action@v3](https://github.com)
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Build image with Buildpacks
        uses: [buildpacks/github-actions/setup-pack@v5](https://github.com)
      
      - name: Run pack build
        run: |
          pack build ${{ secrets.DOCKER_USERNAME }}/my-node-app \
            --builder gcr.io/paketo-buildpacks/builder:base \
            --publish
