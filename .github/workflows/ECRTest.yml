name: Deploy Existing Docker Image to ecr and spin up ec2 instance

on:
  push:
    branches:
      - Develop
    paths:
      - 'terraform-manifests/**'

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: nodejsapp

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Verify AWS Identity
      run: aws sts get-caller-identity

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Pull Existing Image
      run: |
        docker pull node-app:latest

    - name: Tag Image for ECR
      run: |
        docker tag node-app:latest \
        ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest

    - name: Push Image to ECR
      run: |
        docker push \
        ${{ steps.login-ecr.outputs.registry }}/$ECR_REPOSITORY:latest

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      working-directory: terraform-manifests
      run: terraform init

    - name: Terraform Apply
      working-directory: terraform-manifests
      run: terraform apply -auto-approve
